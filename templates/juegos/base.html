<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PS2 Games{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(19, 32, 51, 0.85);
      --panel-strong: rgba(8, 19, 25, 0.96);
      --accent: #2dd4bf;
      --accent-2: #22c55e;
      --text: #ecfeff;
      --muted: #a3b7c6;
      --danger: #ef4444;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #020b17 0%, #0d1320 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page-shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 36px 32px 60px;
    }

    .hero {
      background: linear-gradient(90deg, rgba(0, 60, 57, 0.95), rgba(12, 36, 46, 0.98));
      border: 2px solid rgba(45, 212, 191, 0.9);
      border-radius: 18px;
      box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.1), 0 16px 30px rgba(0, 0, 0, 0.25);
      padding: 28px 32px;
      margin-bottom: 30px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.2rem, 2.5vw, 4rem);
      font-weight: 800;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .bolt {
      font-size: 0.8em;
      color: #facc15;
      transform: rotate(12deg);
      display: inline-block;
    }

    .hero p {
      margin-top: 18px;
      margin-bottom: 0;
      font-size: clamp(1.2rem, 1.8vw, 2.2rem);
      line-height: 1.4;
      color: #d9f5ff;
    }

    .hero strong {
      font-weight: 800;
      color: #7ef9d8;
    }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 22px 0;
      font-size: clamp(1.2rem, 1.8vw, 2rem);
      color: #ebf7ff;
    }

    .step {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #0ea5e9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(14, 165, 233, 0.4);
    }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      border-radius: 999px;
      padding: 10px 18px;
      text-decoration: none;
      font-weight: 700;
      transition: filter 0.2s ease;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(1.08); }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #2dd4bf);
      color: #062b28;
      box-shadow: 0 0 18px rgba(45, 212, 191, 0.35);
    }

    .btn-secondary {
      border-color: rgba(45, 212, 191, 0.8);
      color: var(--accent);
      background: rgba(10, 30, 35, 0.5);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
    }

    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(45, 212, 191, 0.3);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px;
      margin-top: 20px;
    }

    .card h2 {
      margin-top: 0;
      color: #abf7d4;
      font-size: 2rem;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      color: #ecfeff;
    }

    .table th, .table td {
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      padding: 14px 12px;
      text-align: left;
    }

    .table th {
      color: #9ae6b4;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .table a {
      color: #5eead4;
      text-decoration: none;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: #a7f3d0;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(45, 212, 191, 0.35);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 1rem;
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    .messages {
      list-style: none;
      margin: 0 0 18px;
      padding: 0;
    }

    .messages li {
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #bbf7d0;
    }

    .login-box {
      max-width: 460px;
      margin: 80px auto 0;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(45, 212, 191, 0.4);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.35);
    }

    .login-box h1 {
      margin-top: 0;
      color: #7ef9d8;
      text-align: center;
      margin-bottom: 24px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin: 0 0 26px;
      color: var(--muted);
    }

    .status strong {
      color: var(--text);
    }

    @media (max-width: 768px) {
      .page-shell {
        padding: 22px 18px 40px;
      }

      .hero {
        padding: 20px 18px;
      }

      .btn-row {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
